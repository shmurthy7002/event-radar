sources:
  - {slug: sf, kind: city}
  - {slug: ai, kind: category}
  - {slug: tech, kind: category}
horizon_days: 14
origin: {latitude: 37.8715, longitude: -122.2730}
radius_km: 60
unknown_location: exclude
exclude_sold_out: false
exclude_waitlist: false
requests:
  timeout_seconds: 15
  retries: 2
  max_backoff_seconds: 30
  pages_per_source: 5
  total_requests: 50
  detail_requests: 20
digest_length: 30
interests:
  # Each keyword/phrase maps to its title points. Edit these independently.
  # Strongest title match per group wins; description-only groups get 1 point.
  # See docs/relevance.md for examples, aggregation, and preview instructions.
  robotics:
    robotics: 3
    robots: 3
    embodied AI: 3
  research:
    RL: 3
    ML: 3
    reinforcement learning: 3
    machine learning: 3
  safety:
    AI safety: 3
    alignment: 3
  hackathons:
    hackathon: 3
    hackathons: 3
  startups:
    technical startup: 3
    AI startup: 3
    founders: 3
    developer tools: 3
negative_keywords: [speed dating]
minimum_score: 1
